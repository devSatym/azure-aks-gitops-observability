apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-webapp
  template:
    metadata:
      labels:
        app: azure-webapp
    spec:
      containers:
        - name: azure-webapp
          image: acraksdemodevaafof8.azurecr.io/azure-webapp:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: azure-webapp-service
spec:
  type: LoadBalancer
  selector:
    app: azure-webapp
  ports:
    - port: 80
      targetPort: 80
