apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devSatym/azure-aks-gitops-observability.git
    # The validation branch has been promoted. Keep Argo CD on released Git
    # desired state while retaining the feature branch as a rollback reference.
    targetRevision: main
    path: helm/opentelemetry-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
