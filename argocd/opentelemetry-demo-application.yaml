apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devSatym/azure-aks-gitops-observability.git
    # This preview application follows the dedicated migration branch. Change
    # this to main in the merge commit so Argo CD continues to track released
    # desired state.
    targetRevision: feature/otel-demo-azure-observability
    path: helm/opentelemetry-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
