apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-webapp
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devSatym/azure-aks-terraform-cicd-monitoring.git
    targetRevision: main
    path: helm/azure-webapp
    helm:
      parameters:
        - name: image.repository
          value: acraksdemodevjv094d.azurecr.io/azure-webapp
        - name: image.tag
          value: v1

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
