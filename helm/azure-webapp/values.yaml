# The original app remains a deliberately small CI -> ACR -> GitOps canary.
# The OpenTelemetry Demo is the primary observability workload.
replicaCount: 1

image:
  # GitHub Actions changes only image.tag after pushing an immutable SHA image.
  repository: "acraksopsdevn8bo7j.azurecr.io/azure-webapp"
  tag: "9d37a77"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

container:
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
