replicaCount: 2

image:
  # Replace this bootstrap repository once Terraform has created the project ACR.
  # GitHub Actions subsequently changes only image.tag.
  repository: "YOUR_ACR_LOGIN_SERVER.azurecr.io/azure-webapp"
  tag: "bootstrap"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

container:
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
