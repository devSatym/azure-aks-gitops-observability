name: Build, Push and Update GitOps

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-aks.yml"

permissions:
  id-token: write
  contents: write

concurrency:
  group: gitops-image-promotion-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-push-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate repository variables
        run: |
          for variable in ACR_NAME ACR_LOGIN_SERVER IMAGE_NAME; do
            if [ -z "${!variable}" ]; then
              echo "Missing required repository variable: ${variable}" >&2
              exit 1
            fi
          done

      - name: Calculate immutable image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}" ./app

      - name: Push Docker image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Update Helm desired state
        env:
          VALUES_FILE: helm/azure-webapp/values.yaml
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          values_file = Path(os.environ["VALUES_FILE"])
          lines = values_file.read_text().splitlines(keepends=True)
          image_start = next((i for i, line in enumerate(lines) if line == "image:\n"), None)
          if image_start is None:
              raise SystemExit("Could not find the top-level image block")

          tag_indexes = []
          for index in range(image_start + 1, len(lines)):
              line = lines[index]
              if line and not line[0].isspace() and line.strip():
                  break
              if re.match(r"^  tag:\s*", line):
                  tag_indexes.append(index)

          if len(tag_indexes) != 1:
              raise SystemExit(f"Expected one image.tag entry, found {len(tag_indexes)}")

          lines[tag_indexes[0]] = f'  tag: "{os.environ["IMAGE_TAG"]}"\n'
          values_file.write_text("".join(lines))
          PY
          git diff -- "$VALUES_FILE"

      - name: Commit GitOps image tag
        env:
          VALUES_FILE: helm/azure-webapp/values.yaml
        run: |
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "Desired image tag is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore(gitops): deploy ${IMAGE_TAG} [skip ci]"
          git push
